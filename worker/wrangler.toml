[assets]
directory = "../dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[ai]
binding = "AI"

[vars]
AI_MODELS = "@cf/meta/llama-3.3-70b-instruct-fp8-fast,@cf/meta/llama-3.1-8b-instruct-fast,@cf/meta/llama-3.1-8b-instruct"
