name: Collect ranked data

on:
  schedule:
    - cron: "17 */8 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: "Crawl minutes for this run (blank = automatic)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write
  models: read

concurrency:
  group: collect-ranked
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
      HAS_DISCORD: ${{ secrets.DISCORD_WEBHOOK_URL != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Plan run length
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_MINUTES: ${{ inputs.minutes }}
          VAR_MINUTES: ${{ vars.CRAWL_MINUTES }}
          ACTIONS_BUDGET_MINUTES: ${{ vars.ACTIONS_BUDGET_MINUTES }}
        run: |
          echo "start=$(date +%s)" >> "$GITHUB_OUTPUT"
          private=$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)
          if [ -n "$INPUT_MINUTES" ]; then minutes=$INPUT_MINUTES
          elif [ -n "$VAR_MINUTES" ]; then minutes=$VAR_MINUTES
          elif [ "$private" = "true" ]; then minutes=$(python3 collector/budget.py plan)
          else minutes=320; fi
          echo "private=$private minutes=$minutes"
          echo "minutes=$minutes" >> "$GITHUB_OUTPUT"
          echo "timeout=$((minutes + minutes / 45 * 5 + 20))" >> "$GITHUB_OUTPUT"
          echo "private=$private" >> "$GITHUB_OUTPUT"

      - name: Collect
        id: collect
        if: steps.plan.outputs.minutes != '0'
        timeout-minutes: ${{ fromJSON(steps.plan.outputs.timeout) }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BRAWL_STARS_API_KEY: ${{ secrets.BRAWL_STARS_API_KEY }}
        run: bash collector/run.sh "${{ steps.plan.outputs.minutes }}" 45

      - name: Deploy website
        id: site
        if: ${{ !cancelled() && env.HAS_CLOUDFLARE == 'true' && steps.plan.outputs.minutes != '0' }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BRAWL_STARS_API_KEY: ${{ secrets.BRAWL_STARS_API_KEY }}
        run: bash deploy/deploy.sh

      - name: Update edge frontier
        if: ${{ !cancelled() && env.HAS_CLOUDFLARE == 'true' && steps.plan.outputs.minutes != '0' }}
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 collector/edge.py push-frontier --core work/core.db

      - name: Discord report
        if: ${{ !cancelled() && env.HAS_DISCORD == 'true' && steps.plan.outputs.minutes != '0' }}
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SITE_URL: ${{ steps.site.outputs.url || vars.SITE_URL }}
        run: |
          pip install --quiet pillow
          python3 collector/discord_report.py

      - name: Chain next run
        if: ${{ !cancelled() && steps.plan.outputs.private == 'false' && fromJSON(steps.plan.outputs.minutes) >= 60 && fromJSON(steps.collect.outputs.ran_minutes || '0') >= 20 }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --ref "$GITHUB_REF_NAME"

      - name: Record usage
        if: ${{ always() && steps.plan.outputs.private == 'true' && steps.plan.outputs.start != '' }}
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python3 collector/budget.py record "${{ steps.plan.outputs.start }}"
          bash collector/commit_stats.sh || true
