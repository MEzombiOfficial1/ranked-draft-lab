name: Deploy website

on:
  push:
    branches: [main]
    paths: [site/**, worker/**, deploy/**, .github/workflows/deploy.yml]
  workflow_dispatch:
    inputs:
      force_secret:
        description: "Re-upload the Brawl Stars key to the Worker (after rotating it)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - name: Test draft engine
        run: node site/test/engine.test.mjs
      - name: Deploy
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          BRAWL_STARS_API_KEY: ${{ secrets.BRAWL_STARS_API_KEY }}
          FORCE_SECRET: ${{ inputs.force_secret && '1' || '' }}
        run: bash deploy/deploy.sh
      - name: Warn if not configured
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::warning::Add the CLOUDFLARE_API_TOKEN repository secret to deploy the website."
